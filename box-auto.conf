# 内核选择只看这份规则表：一行一条，条件 => 内核名[, 次选内核, ...]
# 自上而下求值，第一条命中的生效；候选按顺序试，全部不可用就报错退出。
# 判断项：mode / js / conf / tethering / installed / exists / env / always / never
# 组合：not / ! 、and 、or 、( )；简化：A, B => X 等价 A=>X 与 B=>X
#
# 没有 RULES 时：只定义了一个内核就用它，定义了多个则启动报错（脚本不替用户猜）。
#
# 让路规则（bin/mihomo 是 App「更新核心」也在写的槽）：
#   规则选中 FALLBACK_CORE（默认 vanilla）时，若 bin/mihomo 是 App 自己装的，脚本不覆盖；
#   只有 bin/mihomo 是本脚本装过的另一个内核时，才换回 fallback。
#   规则选中 ebpf 这类自定义内核时，脚本用独立副本覆盖 bin/mihomo（不留备份文件）。
#
# 下面这组是「eBPF 模式用 ebpf-我的，其余模式用 vanilla-我的」：
FALLBACK_CORE=vanilla
RULES='
mode=ebpf => ebpf
always    => vanilla
'
