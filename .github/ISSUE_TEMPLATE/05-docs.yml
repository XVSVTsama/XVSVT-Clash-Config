name: 📖 文档问题
description: README 或仓库文档有误、过时或缺失
title: "[文档] "
labels:
  - documentation
body:
  - type: checkboxes
    id: prechecks
    attributes:
      label: 前置确认
      options:
        - label: 已搜索现有 Issue，确认没有重复
          required: true
        - label: 已对照当前 main 的代码 / 配置确认文档确实有误，而不是版本滞后
          required: true
  - type: input
    id: location
    attributes:
      label: 文档位置
      description: README 的章节名、文档文件名或链接
      placeholder: README「JavaScript 说明」一节
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题说明
      description: 文档现在写的是什么，错在哪里或缺了什么；如与代码不符请指出对应的代码位置
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议改法
      description: 建议改成的表述，没有也可不填
    validations:
      required: false
