name: ➕ 新增分流请求
description: 请求新增某个服务、域名、进程或规则集的分流
title: "[请求] "
labels:
  - enhancement
  - routing
body:
  - type: markdown
    attributes:
      value: |
        本仓库为自用配置，请求类 Issue 不保证采纳，与维护者自身使用无关的请求可能直接关闭。
        没有出处依据（官网域名、官方包名等可核实来源）的请求不予处理。
  - type: checkboxes
    id: prechecks
    attributes:
      label: 前置确认
      options:
        - label: 已查 README 现有代理组与规则，确认尚未覆盖该目标
          required: true
        - label: 已搜索现有 Issue，确认没有重复请求
          required: true
        - label: 已知悉本仓库为自用配置，请求不保证采纳
          required: true
  - type: dropdown
    id: request-type
    attributes:
      label: 请求类型
      options:
        - 新增域名分流
        - 新增进程 / 包名分流
        - 新增规则集
        - 新增策略组
        - 其他
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: 目标服务名称
      placeholder: 例如某某 App / 某某网站
    validations:
      required: true
  - type: textarea
    id: targets
    attributes:
      label: 域名 / 包名 / 规则内容
      description: 逐条列出要分流的域名后缀、完整域名或应用包名
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 出处依据
      description: 可核实的来源链接：官网、官方文档、应用商店页面、抓包/连接日志结论等
    validations:
      required: true
  - type: input
    id: expected-group
    attributes:
      label: 期望策略组
      description: 期望并入的现有组，或建议的新组名
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: 理由 / 使用场景
      description: 为什么需要单独分流，不分流会有什么问题
    validations:
      required: false
