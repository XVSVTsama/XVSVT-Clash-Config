name: JavaScript Syntax

on:
  push:
    branches: [main]
    paths:
      - script_override.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: js-syntax
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax
        run: node --check script_override.js
