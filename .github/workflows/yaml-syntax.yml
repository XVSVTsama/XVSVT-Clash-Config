name: YAML Syntax

on:
  push:
    branches: [main]
    paths:
      - mihomo.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yaml-syntax
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: pip install yamllint
      - name: Check syntax
        run: yamllint -c .yamllint mihomo.yaml
