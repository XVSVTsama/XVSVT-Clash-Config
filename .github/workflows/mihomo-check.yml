name: Mihomo Real Core Check

on:
  push:
    branches: [main]
    paths:
      - mihomo.yaml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mihomo-check
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check 45-minute cooldown
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual run: no cooldown"
            exit 0
          fi
          set +e
          LAST=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/mihomo-check.yml/runs?event=push&per_page=10" \
            | jq -r --arg current "$CURRENT_RUN" '[.workflow_runs[] | select((.id|tostring) != $current)][0].created_at // empty')
          set -e
          if [ -z "$LAST" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "no previous push run"
            exit 0
          fi
          LAST_TS=$(date -d "$LAST" +%s)
          NOW=$(date +%s)
          AGE=$(( (NOW - LAST_TS) / 60 ))
          if [ "$AGE" -lt 45 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipped: last push run was ${AGE}m ago (<45m)"
            {
              echo "### Mihomo check skipped"
              echo ""
              echo "Last push run was ${AGE} minutes ago (< 45 minutes). Manual runs are not affected."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "last push run was ${AGE}m ago"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-amd64
            prefix: mihomo-linux-amd64-
            archive: gz
            qemu: ""
          - runner: ubuntu-latest
            target: linux-arm64
            prefix: mihomo-linux-arm64-
            archive: gz
            qemu: qemu-aarch64
          - runner: ubuntu-latest
            target: linux-armv7
            prefix: mihomo-linux-armv7-
            archive: gz
            qemu: qemu-arm
          - runner: ubuntu-latest
            target: android-arm64-v8
            prefix: mihomo-android-arm64-v8-
            archive: gz
            qemu: qemu-aarch64
          - runner: windows-latest
            target: windows-amd64
            prefix: mihomo-windows-amd64-
            archive: zip
            qemu: ""
          - runner: macos-latest
            target: darwin-arm64
            prefix: mihomo-darwin-arm64-
            archive: gz
            qemu: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Install qemu
        if: matrix.qemu != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
      - name: Prepare config
        run: python .github/scripts/patch_config.py mihomo.yaml patched-mihomo.yaml
      - name: Test config with mihomo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIHOMO_QEMU: ${{ matrix.qemu }}
        run: python .github/scripts/mihomo_check.py --target ${{ matrix.target }} --prefix ${{ matrix.prefix }} --archive ${{ matrix.archive }} --config patched-mihomo.yaml --timeout 300
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-test-${{ matrix.target }}
          path: |
            mihomo-test.log
            patched-mihomo.yaml
