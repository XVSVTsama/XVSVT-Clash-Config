name: Mihomo Real Core Check

on:
  push:
    branches: [main]
    paths:
      - mihomo.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mihomo-check
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-amd64
            prefix: mihomo-linux-amd64-
            archive: gz
            qemu: ""
          - runner: ubuntu-latest
            target: linux-arm64
            prefix: mihomo-linux-arm64-
            archive: gz
            qemu: qemu-aarch64
          - runner: ubuntu-latest
            target: linux-armv7
            prefix: mihomo-linux-armv7-
            archive: gz
            qemu: qemu-arm
          - runner: ubuntu-latest
            target: android-arm64-v8
            prefix: mihomo-android-arm64-v8-
            archive: gz
            qemu: qemu-aarch64
          - runner: windows-latest
            target: windows-amd64
            prefix: mihomo-windows-amd64-
            archive: zip
            qemu: ""
          - runner: macos-latest
            target: darwin-arm64
            prefix: mihomo-darwin-arm64-
            archive: gz
            qemu: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Install qemu
        if: matrix.qemu != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
      - name: Prepare config
        run: python .github/scripts/patch_config.py mihomo.yaml patched-mihomo.yaml
      - name: Test config with mihomo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIHOMO_QEMU: ${{ matrix.qemu }}
        run: python .github/scripts/mihomo_check.py --target ${{ matrix.target }} --prefix ${{ matrix.prefix }} --archive ${{ matrix.archive }} --config patched-mihomo.yaml --timeout 300
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-test-${{ matrix.target }}
          path: |
            mihomo-test.log
            patched-mihomo.yaml
