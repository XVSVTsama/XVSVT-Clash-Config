# ============================================================================
# box-update.full-example.conf —— 手动部分的“填满”示例
# ============================================================================
#
# 与 box-auto.full-example.conf 配套：那边定义「谁用哪个内核」，
# 这里定义「内核从哪个仓库、哪个资产、哪个版本策略下载」。
#
# 所有 <...> 都是占位符，换成你的实际仓库。

# ============================================================================
# 一、内核清单与来源
# ============================================================================

CORE_LIST='ebpf vanilla spare'
CORE_DEFAULT='ebpf'

# --- 内核 1：自己的 eBPF 构建（跟预发布走）------------------------------
CORE_ebpf_REPO='<owner>/<repo>'            # 例如 example-owner/mihomo
CORE_ebpf_ASSET='*android-arm64*ebpf*.gz'  # 资产名匹配，别把哈希写死
CORE_ebpf_VERSION='prerelease'             # 含预发布的最新一条
CORE_ebpf_RELEASE_TAG=''
CORE_ebpf_URL=''
CORE_ebpf_SHA256=''                        # 留空用发布页自带的 digest
CORE_ebpf_TAG='-ebpf'                      # -v 输出必须含这个串，防止下错文件

# --- 内核 2：官方稳定版 -------------------------------------------------
CORE_vanilla_REPO='<owner>/<repo>'         # 例如 MetaCubeX/mihomo
CORE_vanilla_ASSET='*android-arm64*.gz'
CORE_vanilla_VERSION='latest'              # 只取正式发布
CORE_vanilla_RELEASE_TAG=''
CORE_vanilla_URL=''
CORE_vanilla_SHA256=''
CORE_vanilla_TAG=''

# --- 内核 3：备用构建，固定某个标签 -------------------------------------
CORE_spare_REPO='<owner>/<repo>'
CORE_spare_ASSET='*android-arm64*.gz'
CORE_spare_VERSION='tag'
CORE_spare_RELEASE_TAG='<某个固定标签>'
CORE_spare_URL=''
CORE_spare_SHA256=''
CORE_spare_TAG=''

# ============================================================================
# 二、下载相关
# ============================================================================

API_BASE='https://api.github.com'
DOWNLOAD_PREFIX=''
TOKEN=''
