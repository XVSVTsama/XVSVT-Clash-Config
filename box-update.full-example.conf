# ============================================================================
# box-update.full-example.conf —— 手动部分的完整示例（研究用）
# ============================================================================
#
# 与 box-auto.full-example.conf 配套：那边定义「谁用哪个内核」，
# 这里定义「从哪个仓库下载」。只填仓库就够，版本策略与资产名都有默认值。
#
# 抄进 scripts/box-update.conf，把 <owner>/<repo> 换成你的仓库。

CORE_ebpf_REPO='<owner>/<repo>'        # 自己的 eBPF 构建（默认按预发布找）
CORE_vanilla_REPO='<owner>/<repo>'     # 官方稳定版（想要才填）

# 默认值参考：
#   ebpf     → VERSION='prerelease' ASSET='*android-arm64*ebpf*.gz'
#   其它     → VERSION='latest'     ASSET='*android-arm64*.gz'
#
# 需要时再写的高级项：
# CORE_ebpf_TAG='-ebpf'                # -v 输出必须含这个串，防止下错文件
# CORE_ebpf_ASSET='*android-arm64*ebpf*.gz'
# CORE_ebpf_VERSION='prerelease'
# CORE_ebpf_URL=''                     # 固定地址 / file://，填了就不查仓库
# CORE_ebpf_SHA256=''                  # 仓库带 digest 时自动使用
#
# API_BASE='https://api.github.com'    # 直连困难时换镜像的 API 地址
# DOWNLOAD_PREFIX=''                   # <前缀>/<原地址去掉 https://>
# TOKEN=''                             # GitHub Token，等同账号凭据，别提交
