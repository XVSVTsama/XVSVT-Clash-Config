<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>节点处理三维视图 · XVSVT-Clash-Config</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  body { margin: 0; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #1f2328; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .hint { margin: 0 0 12px; color: #59636e; font-size: 14px; line-height: 1.6; }
  #plot { width: 100%; height: 72vh; min-height: 480px; }
  .toolbar { margin: 0 0 10px; }
  .toolbar button { font: inherit; padding: 6px 12px; border: 1px solid #d1d9e0; border-radius: 6px; background: #f6f8fa; color: inherit; }
  #detail { margin-top: 12px; padding: 12px 14px; border: 1px solid #d1d9e0; border-radius: 8px; font-size: 14px; line-height: 1.7; min-height: 44px; }
  #detail .muted { color: #59636e; }
  .legend { margin-top: 14px; font-size: 13px; color: #59636e; }
  .legend span { display: inline-block; margin: 2px 14px 2px 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .funcs { margin-top: 10px; font-size: 13px; color: #59636e; line-height: 1.9; }
  .funcs span { display: inline-block; margin-right: 16px; white-space: nowrap; }
  @media (max-width: 640px) { body { padding: 12px; } #plot { height: 68vh; min-height: 440px; } }
</style>
</head>
<body>
<h1>节点处理三维视图</h1>
<p class="hint">拖拽旋转、双指捏合或滚轮缩放、双击重置视角；也可用图上方工具栏。点击坐标点，详情显示在下方。轴刻度使用编号：X 功能（F1–F10）、Y 处理方式（M1–M3）、Z 节点来源（S1–S3），对照见下方。</p>
<div class="toolbar"><button id="fs" type="button">全屏查看</button></div>
<div id="plot"></div>
<div id="detail"><span class="muted">点击坐标点，详情显示在下方。</span></div>
<div class="legend" id="legend"></div>
<div class="funcs" id="sources"></div>
<div class="funcs" id="funcs"></div>
<script>
const SOURCES = [
  { id: 'S1', short: 'proxies', full: '原始 YAML 的 proxies' },
  { id: 'S2', short: 'proxy-providers', full: '原生 YAML 的 proxy-providers' },
  { id: 'S3', short: 'JS 补充', full: 'JS 外部定义补充' }
];
const MODES = [
  { id: 'M1', name: '筛选/剔除', color: '#1f6feb' },
  { id: 'M2', name: '注入', color: '#d4a72c' },
  { id: 'M3', name: '修正字段', color: '#8250df' }
];
const FUNCS = [
  { id: 'F1', name: '高倍率筛选' },
  { id: 'F2', name: '低倍率筛选' },
  { id: 'F3', name: '国家/地区分组' },
  { id: 'F4', name: 'TGDC实验分流' },
  { id: 'F5', name: '入口解析' },
  { id: 'F6', name: '强制证书验证' },
  { id: 'F7', name: '试开启节点UDP' },
  { id: 'F8', name: 'IPv6优先' },
  { id: 'F9', name: '启用 Reality 增强' },
  { id: 'F10', name: 'hosts 改写节点 server' }
];
const POINTS = [
  { f: 'F1', s: 'S1', m: 'M1', desc: '删除名称含显式 >=2x 的顶层节点' },
  { f: 'F2', s: 'S1', m: 'M1', desc: '删除名称含显式 <=0.5x 的顶层节点' },
  { f: 'F3', s: 'S1', m: 'M1', desc: '按名称筛出地区候选，生成显式列表组' },
  { f: 'F4', s: 'S1', m: 'M1', desc: '筛出地区候选，生成保底列表' },
  { f: 'F5', s: 'S1', m: 'M1', desc: '排除与入口节点同名的顶层节点' },
  { f: 'F5', s: 'S2', m: 'M1', desc: 'exclude-filter 连带排除 provider 中的同名节点' },
  { f: 'F5', s: 'S3', m: 'M2', desc: '注入脚本维护区的入口节点，写入顶层 proxies' },
  { f: 'F6', s: 'S1', m: 'M3', desc: '顶层直接写 skip-cert-verify=false' },
  { f: 'F6', s: 'S2', m: 'M3', desc: 'provider 经 override.skip-cert-verify=false 生效' },
  { f: 'F7', s: 'S1', m: 'M3', desc: '顶层直接写 udp=true' },
  { f: 'F7', s: 'S2', m: 'M3', desc: 'provider 经 override.udp=true 生效' },
  { f: 'F8', s: 'S1', m: 'M3', desc: '按原值改写 ip-version' },
  { f: 'F8', s: 'S2', m: 'M3', desc: '统一写 override.ip-version=ipv6-prefer' },
  { f: 'F9', s: 'S1', m: 'M3', desc: '写 reality-opts.support-x25519mlkem768=true' },
  { f: 'F10', s: 'S1', m: 'M3', desc: '把节点 server 换成 hosts 映射' }
];
</script>
<script>
const funcIndex = Object.fromEntries(FUNCS.map((f, i) => [f.id, i + 1]));
const sourceIndex = Object.fromEntries(SOURCES.map((s, i) => [s.id, i]));
const modeIndex = Object.fromEntries(MODES.map((m, i) => [m.id, i]));
const modeById = Object.fromEntries(MODES.map(m => [m.id, m]));
const funcById = Object.fromEntries(FUNCS.map(f => [f.id, f]));
const sourceById = Object.fromEntries(SOURCES.map(s => [s.id, s]));

const traces = MODES.map(mode => {
  const pts = POINTS.filter(p => p.m === mode.id);
  return {
    type: 'scatter3d',
    mode: 'markers',
    name: mode.name,
    x: pts.map(p => funcIndex[p.f]),
    y: pts.map(p => modeIndex[p.m]),
    z: pts.map(p => sourceIndex[p.s]),
    customdata: pts.map(p => [funcById[p.f].name, mode.name, sourceById[p.s].full, p.desc]),
    marker: { size: 4, color: mode.color, opacity: 0.95, line: { color: '#fff', width: 0.6 } },
    hoverinfo: 'none'
  };
});

const layout = {
  paper_bgcolor: '#fff',
  plot_bgcolor: '#fff',
  font: { family: 'system-ui, -apple-system, "Segoe UI", sans-serif', color: '#1f2328', size: 12 },
  margin: { l: 0, r: 0, t: 36, b: 0 },
  showlegend: false,
  scene: {
    dragmode: 'orbit',
    xaxis: { title: { text: '功能', font: { size: 10 } }, tickvals: FUNCS.map((f, i) => i + 1), ticktext: FUNCS.map(f => f.id), range: [0.5, 10.5], tickfont: { size: 9 } },
    yaxis: { title: { text: '处理方式', font: { size: 10 } }, tickvals: [0, 1, 2], ticktext: MODES.map(m => m.id), range: [-0.6, 2.6], tickfont: { size: 9 } },
    zaxis: { title: { text: '节点来源', font: { size: 10 } }, tickvals: [0, 1, 2], ticktext: SOURCES.map(s => s.id), range: [-0.6, 2.6], tickfont: { size: 9 } },
    aspectratio: { x: 2, y: 1, z: 1 },
    camera: { eye: { x: 2.2, y: -2.4, z: 1.4 }, up: { x: 0, y: 0, z: 1 } }
  }
};

const config = { responsive: true, displayModeBar: true, displaylogo: false };

const plotEl = document.getElementById('plot');
const MODE_COLOR_NAMES = { M1: '蓝色', M2: '黄色', M3: '紫色' };
Plotly.newPlot('plot', traces, layout, config).then(() => {
  plotEl.on('plotly_click', (e) => {
    const p = e.points[0];
    const f = FUNCS[Number(p.x) - 1];
    const m = MODES[Number(p.y)];
    const s = SOURCES[Number(p.z)];
    if (!f || !m || !s) return;
    const point = POINTS.find(q => q.f === f.id && q.m === m.id && q.s === s.id);
    const others = MODES.filter(x => x.id !== m.id && POINTS.some(q => q.f === f.id && q.m === x.id));
    let html = '<b>已选中坐标为 (' + f.id + ', ' + m.id + ', ' + s.id + ') 的坐标点</b><br>'
      + 'X 功能：' + f.id + ' ' + f.name + '<br>'
      + 'Y 处理方式：' + m.id + ' ' + m.name + '<br>'
      + 'Z 节点来源：' + s.id + ' ' + s.full + '<br>'
      + '选中坐标点颜色为' + (MODE_COLOR_NAMES[m.id] || m.name) + '，你正在查看 ' + f.name
      + ' 的部分节点处理办法为：' + (point ? point.desc : '') + '。<br>';
    if (others.length === 0) {
      html += '该功能只有这一方面的处理办法。';
    } else {
      html += '该功能还有 ' + others.map(x => {
        const q = POINTS.find(y => y.f === f.id && y.m === x.id);
        return x.name + ' 方面的处理办法，请点击坐标 (' + f.id + ', ' + x.id + ', ' + q.s + ')';
      }).join('；') + '。';
    }
    document.getElementById('detail').innerHTML = html;
  });
});

document.getElementById('fs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (plotEl.requestFullscreen) plotEl.requestFullscreen();
});
document.addEventListener('fullscreenchange', () => {
  if (window.Plotly) Plotly.Plots.resize(plotEl);
});

document.getElementById('legend').innerHTML = MODES.map(m =>
  '<span><i class="dot" style="background:' + m.color + '"></i><b>' + m.id + '</b> ' + m.name + '</span>'
).join('');
document.getElementById('sources').innerHTML = SOURCES.map(s =>
  '<span><b>' + s.id + '</b> ' + s.full + '</span>'
).join('');
document.getElementById('funcs').innerHTML = FUNCS.map(f =>
  '<span><b>' + f.id + '</b> ' + f.name + '</span>'
).join('');
</script>
</body>
</html>
