<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>节点处理三维视图 · XVSVT-Clash-Config</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  body { margin: 0; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #1f2328; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .hint { margin: 0 0 12px; color: #59636e; font-size: 14px; line-height: 1.6; }
  #plot { width: 100%; height: 72vh; min-height: 480px; }
  .toolbar { margin: 0 0 10px; }
  .toolbar button { font: inherit; padding: 6px 12px; border: 1px solid #d1d9e0; border-radius: 6px; background: #f6f8fa; color: inherit; }
  #detail { margin-top: 12px; padding: 12px 14px; border: 1px solid #d1d9e0; border-radius: 8px; font-size: 14px; line-height: 1.7; min-height: 44px; }
  #detail .muted { color: #59636e; }
  .legend { margin-top: 14px; font-size: 13px; color: #59636e; }
  .legend span { display: inline-block; margin: 2px 14px 2px 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .funcs { margin-top: 10px; font-size: 13px; color: #59636e; line-height: 1.9; }
  .funcs span { display: inline-block; margin-right: 16px; white-space: nowrap; }
  @media (max-width: 640px) { body { padding: 12px; } #plot { height: 68vh; min-height: 440px; } }
</style>
</head>
<body>
<h1>节点处理三维视图</h1>
<p class="hint">拖拽旋转、双指捏合或滚轮缩放、双击重置视角；也可用图上方工具栏。点击坐标点，详情显示在下方。轴刻度使用编号：X 节点来源（X1–X3）、Y 节点处理办法（Y1–Y3）、Z 功能名称（Z1–Z10），对照见下方。坐标含义：x+y+z 表示 Z 功能中按 Y 处理办法处理的节点，来源为 X；x+y、x+z 没有实际意义。</p>
<div class="toolbar"><button id="fs" type="button">全屏查看</button></div>
<div id="plot"></div>
<div id="detail"><span class="muted">点击坐标点，详情显示在下方。</span></div>
<div class="legend" id="legend"></div>
<div class="funcs" id="sources"></div>
<div class="funcs" id="funcs"></div>
<script>
const SOURCES = [
  { id: 'X1', short: 'proxies', full: '原始 YAML 的 proxies' },
  { id: 'X2', short: 'proxy-providers', full: '原生 YAML 的 proxy-providers' },
  { id: 'X3', short: 'JS 补充', full: 'JS 外部定义补充' }
];
const MODES = [
  { id: 'Y1', name: '筛选/剔除', color: '#1f6feb' },
  { id: 'Y2', name: '注入', color: '#d4a72c' },
  { id: 'Y3', name: '修正字段', color: '#8250df' }
];
const FUNCS = [
  { id: 'Z1', name: '高倍率筛选' },
  { id: 'Z2', name: '低倍率筛选' },
  { id: 'Z3', name: '国家/地区分组' },
  { id: 'Z4', name: 'TGDC实验分流' },
  { id: 'Z5', name: '入口解析' },
  { id: 'Z6', name: '强制证书验证' },
  { id: 'Z7', name: '试开启节点UDP' },
  { id: 'Z8', name: 'IPv6优先' },
  { id: 'Z9', name: '启用 Reality 增强' },
  { id: 'Z10', name: 'hosts 改写节点 server' }
];
const POINTS = [
  { f: 'Z1', s: 'X1', m: 'Y1', desc: '删除名称含显式 >=2x 的顶层节点' },
  { f: 'Z2', s: 'X1', m: 'Y1', desc: '删除名称含显式 <=0.5x 的顶层节点' },
  { f: 'Z3', s: 'X1', m: 'Y1', desc: '按名称筛出地区候选，生成显式列表组' },
  { f: 'Z4', s: 'X1', m: 'Y1', desc: '筛出地区候选，生成保底列表' },
  { f: 'Z5', s: 'X1', m: 'Y1', desc: '排除与入口节点同名的顶层节点' },
  { f: 'Z5', s: 'X2', m: 'Y1', desc: 'exclude-filter 连带排除 provider 中的同名节点' },
  { f: 'Z5', s: 'X3', m: 'Y2', desc: '注入脚本维护区的入口节点，写入顶层 proxies' },
  { f: 'Z6', s: 'X1', m: 'Y3', desc: '顶层直接写 skip-cert-verify=false' },
  { f: 'Z6', s: 'X2', m: 'Y3', desc: 'provider 经 override.skip-cert-verify=false 生效' },
  { f: 'Z7', s: 'X1', m: 'Y3', desc: '顶层直接写 udp=true' },
  { f: 'Z7', s: 'X2', m: 'Y3', desc: 'provider 经 override.udp=true 生效' },
  { f: 'Z8', s: 'X1', m: 'Y3', desc: '按原值改写 ip-version' },
  { f: 'Z8', s: 'X2', m: 'Y3', desc: '统一写 override.ip-version=ipv6-prefer' },
  { f: 'Z9', s: 'X1', m: 'Y3', desc: '写 reality-opts.support-x25519mlkem768=true' },
  { f: 'Z10', s: 'X1', m: 'Y3', desc: '把节点 server 换成 hosts 映射' }
];
</script>
<script>
const funcIndex = Object.fromEntries(FUNCS.map((f, i) => [f.id, i + 1]));
const sourceIndex = Object.fromEntries(SOURCES.map((s, i) => [s.id, i]));
const modeIndex = Object.fromEntries(MODES.map((m, i) => [m.id, i]));
const modeById = Object.fromEntries(MODES.map(m => [m.id, m]));
const funcById = Object.fromEntries(FUNCS.map(f => [f.id, f]));
const sourceById = Object.fromEntries(SOURCES.map(s => [s.id, s]));

const traces = [{
  type: 'scatter3d',
  mode: 'markers',
  x: POINTS.map(p => sourceIndex[p.s]),
  y: POINTS.map(p => modeIndex[p.m]),
  z: POINTS.map(p => funcIndex[p.f]),
  customdata: POINTS.map(p => [p.f, p.m, p.s, p.desc]),
  marker: { size: 4, color: '#1f6feb', opacity: 0.9, line: { color: '#fff', width: 0.6 } },
  hoverinfo: 'none',
  showlegend: false
}];

const layout = {
  paper_bgcolor: '#fff',
  plot_bgcolor: '#fff',
  font: { family: 'system-ui, -apple-system, "Segoe UI", sans-serif', color: '#1f2328', size: 12 },
  margin: { l: 0, r: 0, t: 36, b: 0 },
  showlegend: false,
  scene: {
    dragmode: 'orbit',
    xaxis: { title: { text: '节点来源', font: { size: 10 } }, tickvals: [0, 1, 2], ticktext: SOURCES.map(s => s.id), range: [-0.6, 2.6], tickfont: { size: 9 } },
    yaxis: { title: { text: '节点处理办法', font: { size: 10 } }, tickvals: [0, 1, 2], ticktext: MODES.map(m => m.id), range: [-0.6, 2.6], tickfont: { size: 9 } },
    zaxis: { title: { text: '功能名称', font: { size: 10 } }, tickvals: FUNCS.map((f, i) => i + 1), ticktext: FUNCS.map(f => f.id), range: [0.5, 10.5], tickfont: { size: 9 } },
    aspectratio: { x: 1, y: 1, z: 1.8 },
    camera: { eye: { x: 2.2, y: -2.4, z: 1.4 }, up: { x: 0, y: 0, z: 1 } }
  }
};

const config = { responsive: true, displayModeBar: true, displaylogo: false };

const plotEl = document.getElementById('plot');
Plotly.newPlot('plot', traces, layout, config).then(() => {
  plotEl.on('plotly_click', (e) => {
    const p = e.points[0];
    const s = SOURCES[Number(p.x)];
    const m = MODES[Number(p.y)];
    const f = FUNCS[Number(p.z) - 1];
    if (!f || !m || !s) return;
    const point = POINTS.find(q => q.f === f.id && q.m === m.id && q.s === s.id);
    const others = SOURCES.filter(x => x.id !== s.id && POINTS.some(q => q.f === f.id && q.s === x.id));
    let html = '<b>已选中坐标为 (' + s.id + ', ' + m.id + ', ' + f.id + ') 的坐标点</b><br>'
      + 'X 节点来源：' + s.id + ' ' + s.full + '<br>'
      + 'Y 节点处理办法：' + m.id + ' ' + m.name + '<br>'
      + 'Z 功能名称：' + f.id + ' ' + f.name + '<br>'
      + f.name + ' 功能中按 ' + m.name + ' 处理的节点，来源是 ' + s.full + '。'
      + (point ? '具体：' + point.desc + '。' : '') + '<br>';
    if (others.length === 0) {
      html += '该功能只有这一来源的处理办法。';
    } else {
      html += '该功能还有 ' + others.map(x => {
        const coords = POINTS.filter(y => y.f === f.id && y.s === x.id)
          .map(y => '(' + x.id + ', ' + y.m + ', ' + f.id + ')').join('、');
        return x.full + ' 方面的处理办法，请点击坐标 ' + coords;
      }).join('；') + '。';
    }
    document.getElementById('detail').innerHTML = html;
  });
});

document.getElementById('fs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (plotEl.requestFullscreen) plotEl.requestFullscreen();
});
document.addEventListener('fullscreenchange', () => {
  if (window.Plotly) Plotly.Plots.resize(plotEl);
});

document.getElementById('legend').innerHTML = MODES.map(m =>
  '<span><b>' + m.id + '</b> ' + m.name + '</span>'
).join('');
document.getElementById('sources').innerHTML = SOURCES.map(s =>
  '<span><b>' + s.id + '</b> ' + s.full + '</span>'
).join('');
document.getElementById('funcs').innerHTML = FUNCS.map(f =>
  '<span><b>' + f.id + '</b> ' + f.name + '</span>'
).join('');
</script>
</body>
</html>
