# ============================================================================
# box-auto.full-example.conf —— 自动部分的“填满”示例（供研究 / 抄作业）
# ============================================================================
#
# 场景：一台 root 的 Android 手机跑 BoxProxy
#   · eBPF 模式用自己编译的分支，其余模式用官方 mihomo 稳定版
#   · 额外留一个 spare 内核，用来试用别的构建或临时对比
#
# 配套的手动部分（下载来源）在 box-update.full-example.conf 里，名字要对得上。
# 讲解见 docs/box-core-example.md。
#
# 用法：看懂后抄进 scripts/box-auto.conf（文件管理器里复制改名即可），
# 第一次用之前手动装一次内核：工具 → 脚本 → update-core.sh。
# 之后在 BoxProxy 里选模式启动即可——启动前只会挂载，不联网。

# ============================================================================
# 一、内核名字与文件
# ============================================================================

CORE_LIST='ebpf vanilla spare'

# 文件名默认 core-<名字>；这里显式写出来只是为了让你看清对应关系
CORE_ebpf_FILE='core-ebpf'
CORE_vanilla_FILE='core-vanilla'
CORE_spare_FILE='core-spare'

# ============================================================================
# 二、模式映射：哪个入站用哪个内核
# ============================================================================

MODE_CORE_tun='vanilla'        # TUN → 官方版
MODE_CORE_tproxy='vanilla'     # TPROXY → 官方版
MODE_CORE_ebpf='ebpf'          # eBPF → 自己的构建（本配置的重点）
MODE_CORE_redirect='vanilla'
MODE_CORE_mixed='vanilla'
MODE_CORE_enhance='vanilla'
MODE_CORE_unknown='vanilla'    # 识别不出模式时用官方版，更保守

# ============================================================================
# 三、启动前行为
# ============================================================================

DUMMY_IFACE='boxebpf0'   # eBPF 没开热点时的空转网卡
CONFLICT_STOP='auto'     # 端口真被占用时停掉占用者
STOP_PACKAGES=''         # 额外无条件停的包（留空）
EXTRA_PORTS=''           # 额外检查冲突的端口（留空）
