# ============================================================================
# box-auto.full-example.conf —— 自动部分的完整示例（研究用）
# ============================================================================
#
# 场景：eBPF 模式用自己编译的分支，其余模式用官方版。
# 自动部分的配置只有一行是“真的在做事”的，其余都是默认值。
#
# 抄进 scripts/box-auto.conf 即可（文件管理器复制改名）。
# 配套的下载来源在 box-update.full-example.conf。

# 唯一需要改的一行：eBPF 模式用哪个内核（名字随便起，下面 _FILE 决定文件）
MODE_CORE_ebpf='ebpf'

# 其余模式沿用默认：tun / tproxy / redirect / mixed / enhance / unknown → vanilla
# 想动的话照抄下面这行改：
# MODE_CORE_tun='vanilla'

# 默认文件是 core-<名字>：ebpf → bin/core-ebpf，vanilla → bin/core-vanilla。
# 只有想起别的文件名时才写：
# CORE_ebpf_FILE='core-ebpf'

# 启动前的高级项（下面这些就是默认值，不写效果一样）：
# DUMMY_IFACE='boxebpf0'
# CONFLICT_STOP='auto'
# STOP_PACKAGES=''
# EXTRA_PORTS=''
