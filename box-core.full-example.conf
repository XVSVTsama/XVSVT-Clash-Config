# ============================================================================
# box-core.full-example.conf —— 一份“填满”的配置，供研究 / 抄作业
# ============================================================================
#
# 这不是模板（模板见 box-core.conf.example），而是一个完整场景：
#
#   场景：一台 root 的 Android 手机跑 BoxProxy
#     · eBPF 模式用自己编译的分支（滚动预发布，跟着更新）
#     · 其余模式用官方 mihomo 稳定版
#     · 额外留一个 spare 内核，用来试用别的构建、或者临时对比
#
# 下面所有 <...> 都是占位符，照你的实际情况替换；值本身不重要，
# 重要的是“字段之间的对应关系”，跟着注释读一遍就知道每个字段管什么。
#
# 用法：读懂后，把需要的部分抄进 scripts/box-core.conf，然后
#   sh iface-auto.sh show                  看内核名 / 文件 / 路径 / 状态 / 来源 / 模式映射
#   sh iface-auto.sh update --core ebpf    装或更新某个内核（首次安装也是它）
#   sh iface-auto.sh --dry-run             预览服务启动前会做什么
#
# ============================================================================
# 一、内核清单
# ============================================================================
# 名字只是标签，出现在 show 输出与 --core 参数里。
# 真正决定“写到哪个文件”的是 _FILE。

# 必须列出全部内核名，顺序即 show 的显示顺序
CORE_LIST='ebpf vanilla spare'

# 不带 --core 时 update 装哪个
CORE_DEFAULT='ebpf'

# --- 内核 1：自己的 eBPF 构建（跟预发布走）------------------------------
CORE_ebpf_FILE='core-ebpf'                 # 写进 bin/core-ebpf
CORE_ebpf_REPO='<owner>/<repo>'            # 例如 example-owner/mihomo；带不带 .git 都行
CORE_ebpf_ASSET='*android-arm64*ebpf*.gz'  # 资产名匹配：* 是通配，别把哈希写死
CORE_ebpf_VERSION='prerelease'             # 取“含预发布的最新一条”
CORE_ebpf_RELEASE_TAG=''                   # 仅 VERSION='tag' 时需要
CORE_ebpf_URL=''                           # 填了就不再查仓库（固定版本/本地文件时用）
CORE_ebpf_SHA256=''                        # 留空则用发布页自带的 digest
CORE_ebpf_TAG='-ebpf'                      # 新内核 -v 输出必须含这个串，防止下错文件

# --- 内核 2：官方 mihomo 稳定版 -----------------------------------------
CORE_vanilla_FILE='core-vanilla'           # 写进 bin/core-vanilla
CORE_vanilla_REPO='<owner>/<repo>'         # 例如 MetaCubeX/mihomo
CORE_vanilla_ASSET='*android-arm64*.gz'
CORE_vanilla_VERSION='latest'              # 只取正式发布，不进预发布
CORE_vanilla_RELEASE_TAG=''
CORE_vanilla_URL=''
CORE_vanilla_SHA256=''
CORE_vanilla_TAG=''                        # 官方版不必校验关键字

# --- 内核 3：备用构建（固定某个标签，不跟着变）---------------------------
CORE_spare_FILE='core-spare'               # 写进 bin/core-spare
CORE_spare_REPO='<owner>/<repo>'
CORE_spare_ASSET='*android-arm64*.gz'
CORE_spare_VERSION='tag'
CORE_spare_RELEASE_TAG='<某个固定标签>'      # 例如 alpha-smart-1a2b3c4
CORE_spare_URL=''
CORE_spare_SHA256=''
CORE_spare_TAG=''

# ============================================================================
# 二、模式映射：哪个入站用哪个内核
# ============================================================================
# 右边的值必须是上面 CORE_LIST 里的名字，否则脚本直接报配置错误。
# 只有被用到的内核才会在启动时被 ln -f 到 bin/mihomo。

MODE_CORE_tun='vanilla'        # TUN 模式 → 官方版
MODE_CORE_tproxy='vanilla'     # TPROXY → 官方版
MODE_CORE_ebpf='ebpf'          # eBPF → 自己的构建（这才是本配置的重点）
MODE_CORE_redirect='vanilla'
MODE_CORE_mixed='vanilla'
MODE_CORE_enhance='vanilla'
MODE_CORE_unknown='vanilla'    # 识别不出模式时用官方版，更保守

# ============================================================================
# 三、启动前脚本（iface-auto.sh）的行为
# ============================================================================

# eBPF 没有下联（没开热点）时挂的空转网卡
DUMMY_IFACE='boxebpf0'

# 端口冲突：auto 停掉占着核心端口的第三方应用 | log 只记日志 | off 不检测
CONFLICT_STOP='auto'

# 额外无条件停止的包名（空格分隔）。留空表示不额外停任何应用
STOP_PACKAGES=''

# 除了启动配置里的端口，额外检查冲突的端口（空格分隔）
EXTRA_PORTS=''

# ============================================================================
# 四、下载相关（update 用）
# ============================================================================

# GitHub API 前缀；国内直连困难时换成镜像的 API 地址
API_BASE='https://api.github.com'

# 下载地址改写前缀：<前缀>/<原地址去掉 https://>
# 例如填 'https://gh-proxy.example.com' 后，https://github.com/a/b 会变成
# https://gh-proxy.example.com/https://github.com/a/b；留空表示不改写
DOWNLOAD_PREFIX=''

# GitHub Token，提高 API 配额、缓解 403 限流；等同账号凭据，不要提交
TOKEN=''
