# 下载来源：填 owner/repo（或固定地址），update-core.sh 会把配了来源的内核都装一遍。
#
# 通用默认（脚本不预设任何具体分支）：VERSION='latest'、ASSET='*android-arm64*.gz'。
# 这条 eBPF 分支是滚动预发布，资产名带 -ebpf，所以单独写明：
#
# 注意：不要在这里写 GitHub Token，这个文件会随仓库公开。

CORE_ebpf_REPO='liuran001/mihomo'
CORE_ebpf_VERSION='prerelease'
CORE_ebpf_ASSET='*android-arm64*ebpf*.gz'

# CORE_vanilla_REPO='MetaCubeX/mihomo'   # 官方版由 App 维护，脚本不再下载

# vanilla 不需要在这里配来源：官方 mihomo 由 App 自带的「更新核心」维护，
# bin/vanilla-我的 只用于从 ebpf 模式切回时恢复官方版，App 自己装的内核一律不动。
